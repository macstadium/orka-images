name: Update vm-tools in Base Images

on:
  workflow_dispatch:
    inputs:
      vmToolsVersion:
        description: 'Version of orka-vm-tools to install (e.g., 3.6.0)'
        required: false
        default: '3.6.0'
      images:
        description: 'Comma-separated list of images to update (e.g., sequoia,sonoma). Leave blank to update all.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  update:
    name: ${{ matrix.name }}:${{ matrix.tag }}
    runs-on:
      - self-hosted
      - arm-mini-002
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: tahoe
            source_tag: latest
            tag: latest
            disk_gb: 90
          - name: tahoe
            source_tag: 200-gb
            tag: 200-gb
            disk_gb: 200
          - name: sequoia
            source_tag: latest
            tag: latest
            disk_gb: 90
          - name: sequoia
            source_tag: 200-gb
            tag: 200-gb
            disk_gb: 200
          - name: sonoma
            source_tag: "14.6"
            tag: latest
            disk_gb: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply image filter
        run: |
          if [ -n "${{ inputs.images }}" ] && ! echo ",${{ inputs.images }}," | grep -q ",${{ matrix.name }},"; then
            echo "SKIP_IMAGE=true" >> "$GITHUB_ENV"
          fi

      - name: Preflight check
        if: env.SKIP_IMAGE != 'true'
        run: |
          if ! command -v orka-engine &>/dev/null; then
            echo "orka-engine not found on runner. Register an arm-mini-002 runner with orka-engine pre-installed." >&2
            exit 1
          fi

      - name: Set VM name
        if: env.SKIP_IMAGE != 'true'
        id: vars
        run: |
          echo "VM_NAME=vm-tools-updater-${{ github.run_id }}-${{ matrix.name }}-${{ matrix.tag }}" >> "$GITHUB_OUTPUT"
          echo "TEMP_NAME=vm-tools-updated-${{ github.run_id }}-${{ matrix.name }}-${{ matrix.tag }}" >> "$GITHUB_OUTPUT"

      - name: Pull image
        if: env.SKIP_IMAGE != 'true'
        run: |
          orka-engine image pull \
            ghcr.io/macstadium/orka-images/${{ matrix.name }}:${{ matrix.source_tag }}

      - name: Run VM
        if: env.SKIP_IMAGE != 'true'
        run: |
          orka-engine vm run ${{ steps.vars.outputs.VM_NAME }} \
            --image ghcr.io/macstadium/orka-images/${{ matrix.name }}:${{ matrix.source_tag }} \
            -d

      - name: Wait for VM IP
        if: env.SKIP_IMAGE != 'true'
        timeout-minutes: 5
        id: vm-ip
        run: |
          output=""
          while [ -z "$output" ]; do
            output=$(orka-engine vm list ${{ steps.vars.outputs.VM_NAME }} -o json | jq -r '.[0].ip // empty')
            sleep 1
          done
          echo "VM_IP=$output" >> "$GITHUB_OUTPUT"

      - name: Copy scripts into VM
        if: env.SKIP_IMAGE != 'true'
        env:
          VM_DEFAULT_PASSWORD: ${{ secrets.VM_DEFAULT_PASSWORD }}
        run: |
          sshpass -p "${VM_DEFAULT_PASSWORD}" \
            scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            setup/setup.sh setup/verify.sh \
            "admin@${{ steps.vm-ip.outputs.VM_IP }}:~/"

      - name: Run setup
        if: env.SKIP_IMAGE != 'true'
        env:
          VM_DEFAULT_PASSWORD: ${{ secrets.VM_DEFAULT_PASSWORD }}
        run: |
          sshpass -p "${VM_DEFAULT_PASSWORD}" \
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "admin@${{ steps.vm-ip.outputs.VM_IP }}" \
            "ORKA_VM_TOOLS_VERSION=${{ inputs.vmToolsVersion }} VM_DEFAULT_PASSWORD=${{ secrets.VM_DEFAULT_PASSWORD }} bash ~/setup.sh"

      - name: Set admin user password
        if: env.SKIP_IMAGE != 'true'
        env:
          VM_DEFAULT_PASSWORD: ${{ secrets.VM_DEFAULT_PASSWORD }}
        run: |
          # dscl . -passwd requires the old password even as root on macOS 26 (Tahoe),
          # so use sysadminctl which accepts explicit credentials.
          sshpass -p "${VM_DEFAULT_PASSWORD}" \
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "admin@${{ steps.vm-ip.outputs.VM_IP }}" \
            "echo ${VM_DEFAULT_PASSWORD} | sudo -S sysadminctl -resetPasswordFor admin -newPassword admin -adminUser admin -adminPassword ${VM_DEFAULT_PASSWORD}"

      - name: Reboot VM
        if: env.SKIP_IMAGE != 'true'
        continue-on-error: true
        env:
          VM_DEFAULT_PASSWORD: ${{ secrets.VM_DEFAULT_PASSWORD }}
        run: |
          sshpass -p "${VM_DEFAULT_PASSWORD}" \
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "admin@${{ steps.vm-ip.outputs.VM_IP }}" \
            "echo ${VM_DEFAULT_PASSWORD} | sudo -S reboot"

      - name: Wait for VM to come back online
        if: env.SKIP_IMAGE != 'true'
        timeout-minutes: 5
        env:
          VM_DEFAULT_PASSWORD: ${{ secrets.VM_DEFAULT_PASSWORD }}
        run: |
          vm_ip="${{ steps.vm-ip.outputs.VM_IP }}"
          while ! sshpass -p "${VM_DEFAULT_PASSWORD}" \
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "admin@${vm_ip}" "echo 'VM is back online'" &>/dev/null; do
              sleep 1
          done

      - name: Verify image
        if: env.SKIP_IMAGE != 'true'
        env:
          VM_DEFAULT_PASSWORD: ${{ secrets.VM_DEFAULT_PASSWORD }}
        run: |
          sshpass -p "${VM_DEFAULT_PASSWORD}" \
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "admin@${{ steps.vm-ip.outputs.VM_IP }}" \
            "VM_DEFAULT_PASSWORD=${{ secrets.VM_DEFAULT_PASSWORD }} bash ~/verify.sh ${{ matrix.disk_gb }} ${{ inputs.vmToolsVersion }}"

      - name: Save and push updated image
        if: env.SKIP_IMAGE != 'true'
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          orka-engine vm save ${{ steps.vars.outputs.VM_NAME }} \
            ${{ steps.vars.outputs.TEMP_NAME }}

          orka-engine image push \
            --username ${{ github.actor }} \
            --password "${GITHUB_TOKEN}" \
            ${{ steps.vars.outputs.TEMP_NAME }} \
            ghcr.io/macstadium/orka-images/${{ matrix.name }}:${{ matrix.tag }}

      - name: Cleanup
        if: always() && env.SKIP_IMAGE != 'true'
        run: |
          orka-engine vm delete -f ${{ steps.vars.outputs.VM_NAME }}
